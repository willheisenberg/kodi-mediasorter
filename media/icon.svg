<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="grund" cx="28%" cy="20%" r="100%">
      <stop offset="0%" stop-color="#21304E"/>
      <stop offset="100%" stop-color="#0E1424"/>
    </radialGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#FFCB6B"/>
      <stop offset="55%" stop-color="#F5A02A"/>
      <stop offset="100%" stop-color="#DE7A10"/>
    </linearGradient>
    <linearGradient id="kalt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#334770"/>
      <stop offset="100%" stop-color="#2A3A5C"/>
    </linearGradient>
    <filter id="fall" x="-45%" y="-45%" width="190%" height="190%">
      <feDropShadow dx="-4" dy="20" stdDeviation="15" flood-color="#05070D" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#grund)"/>

  <!-- Der geordnete Stapel -->
  <g>
    <rect x="88" y="88"  width="336" height="82" rx="16" fill="url(#kalt)"/>
    <rect x="88" y="88"  width="12"  height="82" rx="6"  fill="#4C6899"/>

    <rect x="88" y="334" width="336" height="82" rx="16" fill="url(#kalt)"/>
    <rect x="88" y="334" width="12"  height="82" rx="6"  fill="#4C6899"/>
  </g>

  <!-- Die Luecke, in die einsortiert wird: bleibt unten sichtbar -->
  <rect x="88" y="211" width="336" height="82" rx="16"
        fill="#080C17" stroke="#3A4E78" stroke-width="3"/>

  <!-- Die einrastende Kachel: das einzige schraege Element -->
  <g transform="rotate(-10 256 232)" filter="url(#fall)">
    <rect x="88" y="192" width="352" height="82" rx="16" fill="url(#warm)"/>
    <rect x="88" y="192" width="352" height="26" rx="16" fill="#FFFFFF" opacity="0.14"/>
    <rect x="88" y="192" width="12"  height="82" rx="6"  fill="#FFF3DF" opacity="0.92"/>
    <rect x="128" y="219" width="184" height="10" rx="5" fill="#8F4B04" opacity="0.5"/>
    <rect x="128" y="239" width="106" height="10" rx="5" fill="#8F4B04" opacity="0.32"/>
  </g>
</svg>
